<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rynnextdoor</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
    transition:.3s;
}

body.dark{
    background:#111;
    color:#fff;
}

.container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:25px 16px 40px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

.logo{
    font-size:22px;
    font-weight:800;
}

#darkBtn{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:#111;
    color:#fff;
    font-size:19px;
    cursor:pointer;
}

.dark #darkBtn{
    background:#fff;
    color:#111;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    font-size:27px;
    font-weight:900;
}

.title p{
    color:#777;
    margin-top:7px;
    font-size:14px;
}

.dark .title p{
    color:#aaa;
}

.search{
    width:100%;
    padding:15px 18px;
    border:1px solid #ddd;
    border-radius:14px;
    outline:none;
    font-size:14px;
    background:#fff;
    margin-bottom:14px;
}

.dark .search{
    background:#1d1d1d;
    border-color:#333;
    color:#fff;
}

.filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:20px;
}

.filter{
    border:none;
    padding:10px 15px;
    border-radius:10px;
    background:#e9e9e9;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
}

.filter.active{
    background:#111;
    color:#fff;
}

.dark .filter{
    background:#292929;
    color:#fff;
}

.dark .filter.active{
    background:#fff;
    color:#111;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:17px;
    margin-bottom:13px;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.dark .card{
    background:#1c1c1c;
    box-shadow:none;
}

.profile-img{
    width:58px;
    height:58px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
}

.info{
    flex:1;
    min-width:0;
}

.name{
    font-size:16px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:6px;
}

.verified{
    width:18px;
    height:18px;
    border-radius:50%;
    display:inline-flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:11px;
    font-weight:900;
}

.black{
    background:#000;
}

.blue{
    background:#1877f2;
}

.bio{
    font-size:13px;
    color:#777;
    margin-top:5px;
}

.dark .bio{
    color:#aaa;
}

.type{
    display:inline-block;
    margin-top:7px;
    padding:5px 9px;
    border-radius:7px;
    background:#f0f0f0;
    font-size:10px;
    font-weight:700;
}

.dark .type{
    background:#303030;
}

.contact{
    margin-top:9px;
    display:inline-block;
    text-decoration:none;
    background:#111;
    color:#fff;
    padding:8px 12px;
    border-radius:9px;
    font-size:11px;
    font-weight:700;
}

.dark .contact{
    background:#fff;
    color:#111;
}

.menu{
    border:none;
    background:none;
    font-size:22px;
    cursor:pointer;
    color:#777;
    padding:5px;
}

.no-result{
    text-align:center;
    color:#888;
    padding:30px;
    display:none;
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">rynnextdoor</div>
    <button id="darkBtn" onclick="toggleDark()">☾</button>
</header>

<div class="title">
    <h1>MIDMAN BERDAFTAR</h1>
    <p>Sistem transaksi selamat & dipercayai.</p>
</div>

<input
    type="text"
    id="search"
    class="search"
    placeholder="Cari Midman..."
    oninput="searchProfile()"
>

<div class="filters">
    <button class="filter active" onclick="filterProfile('all', this)">
        SEMUA (3)
    </button>

    <button class="filter" onclick="filterProfile('midman', this)">
        MIDMAN (2)
    </button>

    <button class="filter" onclick="filterProfile('seller', this)">
        SELLER (2)
    </button>
</div>

<div id="profiles">

    <!-- RYNQZX -->
    <div class="card" data-type="midman" data-name="rynqzx developer midman reseller">
        <img
            class="profile-img"
            src="https://files.catbox.moe/s6w1hl.jpg"
        >

        <div class="info">
            <div class="name">
                rynqzx
                <span class="verified black">✓</span>
            </div>

            <div class="bio">
                Developer, Midman & Reseller
            </div>

            <span class="type">MIDMAN</span><br>

            <a
                class="contact"
                href="https://t.me/rynqzx"
                target="_blank"
            >
                Telegram
            </a>
        </div>

        <button class="menu">⋮</button>
    </div>


    <!-- REPP STORE -->
    <div class="card" data-type="seller" data-name="repp store reseller mlbb">
        <img
            class="profile-img"
            src="https://files.catbox.moe/kcau56.jpg"
        >

        <div class="info">
            <div class="name">
                Repp Store
                <span class="verified blue">✓</span>
            </div>

            <div class="bio">
                Reseller Mlbb
            </div>

            <span class="type">SELLER</span><br>

            <a
                class="contact"
                href="https://t.me/reppstore"
                target="_blank"
            >
                Telegram
            </a>
        </div>

        <button class="menu">⋮</button>
    </div>


    <!-- MANN RESELLER -->
    <div class="card"
         data-type="both"
         data-name="mann reseller reseller designer midman">

        <img
            class="profile-img"
            src="https://files.catbox.moe/p5q0ex.jpg"
        >

        <div class="info">
            <div class="name">
                Mann Reseller
                <span class="verified blue">✓</span>
            </div>

            <div class="bio">
                Reseller, Designer, Midman
            </div>

            <span class="type">MIDMAN & SELLER</span><br>

            <a
                class="contact"
                href="https://t.me/ManRV1z"
                target="_blank"
            >
                Telegram
            </a>
        </div>

        <button class="menu">⋮</button>
    </div>

</div>

<div class="no-result" id="noResult">
    Tiada profile dijumpai.
</div>

</div>


<script>

let currentFilter = "all";

function filterProfile(type, button){

    currentFilter = type;

    document.querySelectorAll(".filter").forEach(btn=>{
        btn.classList.remove("active");
    });

    button.classList.add("active");

    searchProfile();
}


function searchProfile(){

    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const cards =
        document.querySelectorAll(".card");

    let found = 0;

    cards.forEach(card=>{

        const name =
            card.dataset.name.toLowerCase();

        const type =
            card.dataset.type;

        const matchSearch =
            name.includes(search);

        let matchFilter = true;

        if(currentFilter === "midman"){
            matchFilter =
                type === "midman" ||
                type === "both";
        }

        if(currentFilter === "seller"){
            matchFilter =
                type === "seller" ||
                type === "both";
        }

        if(matchSearch && matchFilter){
            card.style.display = "flex";
            found++;
        }else{
            card.style.display = "none";
        }

    });

    document.getElementById("noResult").style.display =
        found === 0 ? "block" : "none";
}


function toggleDark(){

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    document.getElementById("darkBtn").innerText =
        dark ? "☀" : "☾";

    localStorage.setItem(
        "darkMode",
        dark ? "on" : "off"
    );
}


if(localStorage.getItem("darkMode") === "on"){
    document.body.classList.add("dark");
    document.getElementById("darkBtn").innerText = "☀";
}

</script>

</body>
</html>
